name: Build IDEAL for Windows

on:
  pull_request:
    branches: ['**']
    paths:
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'package.json'
      - 'electron/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'index.html'
      - 'public/**'
      - 'tsconfig.json'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'package.json'
      - 'electron/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'index.html'
      - 'public/**'
      - 'tsconfig.json'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ideal-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set monotonically increasing desktop version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = "0.1.${{ github.run_number }}"
          $package | ConvertTo-Json -Depth 100 | Out-File package.json -Encoding utf8NoBOM
          Write-Host "Building IDEAL version $($package.version)"
      - name: TypeScript check
        run: npm run lint
      - name: Verify French-only application interface
        run: npm run check:french-ui
      - name: Test backup, restore and session protection
        run: npm run test:data-protection
      - name: Test lifecycle policies in an isolated temporary database
        run: npm run test:lifecycle
      - name: Build application and Windows installer
        run: npm run dist:win
      - name: Smoke test packaged Windows application
        run: node scripts/smoke-test-windows.cjs
      - name: Verify installer metadata, signature and SHA-256
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDEAL-Windows-Setup
          path: |
            release/IDEAL-Setup-*.exe
            release/IDEAL-SHA256SUMS.txt
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: IDEAL Windows Build ${{ github.run_number }}
          body: |
            Automatic Windows x64 installer build for IDEAL.
            Install on Windows 10/11 x64. Application data is stored locally in the current Windows user's AppData folder.
            Updates are delivered through GitHub Releases. The application checks for stable updates automatically and preserves local AppData.
            The release includes a SHA-256 checksum manifest for installer integrity verification.
            This installer is not Authenticode-signed in the free GitHub distribution path; Windows SmartScreen may display an unknown-publisher or reputation warning.
            Do not disable Windows Defender or SmartScreen globally. Verify the installer checksum and download source before installing.
          files: |
            release/IDEAL-Setup-*.exe
            release/IDEAL-SHA256SUMS.txt
            release/latest.yml
            release/*.blockmap
          make_latest: true
